[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-processing-toolkit"
dynamic = ["version"]
description = "Natural, queryable access to Quranic text and morphology"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Maysum Panju"}]
dependencies = []
keywords = ["quran", "arabic", "corpus", "morphology", "linguistics", "buckwalter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mhpanju/QuranProcessingToolkit"
Documentation = "https://github.com/mhpanju/QuranProcessingToolkit#readme"
Repository = "https://github.com/mhpanju/QuranProcessingToolkit"
Issues = "https://github.com/mhpanju/QuranProcessingToolkit/issues"

[project.optional-dependencies]
fast = ["orjson>=3.10"]
data = ["quran-processing-toolkit-qac-data==0.4.0"]
dev = ["build>=1.2", "mypy>=1.17", "pytest>=8", "ruff>=0.12", "twine>=6"]

[project.scripts]
quran-toolkit = "quran_processing_toolkit.cli:main"
quran-rebuild = "quran_processing_toolkit.build:main"

[tool.setuptools]
packages = ["quran_processing_toolkit"]

[tool.setuptools.dynamic]
version = {attr = "quran_processing_toolkit.__version__"}

[tool.setuptools.package-data]
"quran_processing_toolkit" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
