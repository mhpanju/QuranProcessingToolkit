name: Publish source-data package

on:
  push:
    tags: ["data-v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import ast
          import os
          from pathlib import Path
          module = ast.parse(Path("packages/quran_processing_toolkit_qac_data/src/quran_processing_toolkit_qac_data/__init__.py").read_text())
          version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          assert os.environ["RELEASE_TAG"] == f"data-v{version}", "Tag/version mismatch"
          PYTHON
      - run: python -m pip install build twine
      - run: python -m build packages/quran_processing_toolkit_qac_data --outdir release-dist
      - run: python -m twine check --strict release-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: data-distributions
          path: release-dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quran-processing-toolkit-qac-data/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: data-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
