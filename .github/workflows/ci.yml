name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check quran_processing_toolkit tests tools.py verses_per_juzz.py
      - run: ruff format --check quran_processing_toolkit tests tools.py verses_per_juzz.py
      - run: python -m unittest discover -s tests -v
      - run: python -m quran_processing_toolkit.build --check
      - run: python -m build
